    使用前配置（一次性）：
    1. GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
       - Homepage URL:        http://localhost:5173 （或正式域名 https://xxx）
       - Authorization callback URL: http://localhost:5173/admin/ （或 https://xxx/admin/）
    2. 把得到的 Client ID 填到下方 config.yml 的 app_id
    3. 访问 /admin/ 即可用 GitHub 账号登录编辑
  -->
