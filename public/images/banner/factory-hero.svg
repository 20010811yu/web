<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a111c"/>
      <stop offset="0.55" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#122540"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c48c"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c48c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#00c48c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00c48c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a5e"/>
      <stop offset="1" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16304f"/>
      <stop offset="1" stop-color="#0c1c33"/>
    </linearGradient>
    <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122741"/>
      <stop offset="1" stop-color="#091526"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c48c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00c48c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#9fd8ff" opacity="0.5">
    <circle cx="120" cy="90" r="1.6"/><circle cx="340" cy="60" r="1.2"/><circle cx="520" cy="140" r="1.4"/>
    <circle cx="760" cy="70" r="1.1"/><circle cx="980" cy="120" r="1.5"/><circle cx="1220" cy="80" r="1.3"/>
    <circle cx="1420" cy="150" r="1.6"/><circle cx="230" cy="200" r="1"/><circle cx="1120" cy="210" r="1.1"/>
    <circle cx="1500" cy="60" r="1.2"/><circle cx="640" cy="230" r="1"/><circle cx="60" cy="260" r="1.2"/>
  </g>

  <!-- sun glow on horizon -->
  <ellipse cx="1150" cy="620" rx="520" ry="300" fill="url(#sun)"/>
  <circle cx="1150" cy="620" r="90" fill="none" stroke="#00c48c" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1150" cy="620" r="140" fill="none" stroke="#00c48c" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- distant skyline -->
  <g fill="#0e2138" opacity="0.9">
    <rect x="40" y="560" width="130" height="140"/>
    <rect x="190" y="600" width="90" height="100"/>
    <rect x="1380" y="580" width="120" height="120"/>
    <rect x="1520" y="540" width="80" height="160"/>
  </g>

  <!-- main factory (left-center) -->
  <g>
    <rect x="180" y="480" width="420" height="220" fill="url(#wallA)"/>
    <!-- solar roof: slanted panels -->
    <g stroke="#00c48c" stroke-opacity="0.5" stroke-width="1.5">
      <path d="M180 480 L330 380 L600 380 L600 480 Z" fill="url(#panel)"/>
      <path d="M255 430 L405 430 M330 380 L330 480 M405 380 L405 480 M480 380 L480 480 M255 430 L255 480" fill="none" opacity="0.8"/>
    </g>
    <!-- roof edge glow -->
    <path d="M180 480 L330 380 L600 380" fill="none" stroke="url(#glow)" stroke-width="3"/>
    <!-- windows -->
    <g fill="#274b73">
      <rect x="220" y="520" width="52" height="90"/><rect x="300" y="520" width="52" height="90"/>
      <rect x="380" y="520" width="52" height="90"/><rect x="460" y="520" width="52" height="90"/><rect x="540" y="520" width="40" height="90"/>
    </g>
    <g fill="#00c48c" opacity="0.85">
      <rect x="222" y="522" width="48" height="30"/><rect x="382" y="522" width="48" height="30"/>
      <rect x="462" y="522" width="48" height="30"/><rect x="302" y="522" width="48" height="30" opacity="0.5"/>
    </g>
    <!-- door -->
    <rect x="356" y="620" width="70" height="80" fill="#0a1626"/>
    <rect x="356" y="620" width="70" height="4" fill="url(#glow)"/>
  </g>

  <!-- secondary factory (right) -->
  <g>
    <rect x="700" y="530" width="330" height="170" fill="url(#wallB)"/>
    <path d="M700 530 L820 440 L1030 440 L1030 530 Z" fill="url(#panel)" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M760 485 L890 485 M820 440 L820 530 M890 440 L890 530" stroke="#00c48c" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <g fill="#1d3c60">
      <rect x="740" y="570" width="44" height="70"/><rect x="810" y="570" width="44" height="70"/><rect x="880" y="570" width="44" height="70"/><rect x="950" y="570" width="44" height="70"/>
    </g>
    <g fill="#3b82f6" opacity="0.7">
      <rect x="742" y="572" width="40" height="24"/><rect x="882" y="572" width="40" height="24"/>
    </g>
  </g>

  <!-- chimneys / towers -->
  <g fill="#0f2340">
    <rect x="640" y="430" width="26" height="270"/>
    <rect x="1080" y="470" width="22" height="230"/>
  </g>
  <g stroke="#00c48c" stroke-opacity="0.8" stroke-width="2">
    <line x1="640" y1="430" x2="666" y2="430"/>
    <line x1="1080" y1="470" x2="1102" y2="470"/>
  </g>
  <circle cx="653" cy="424" r="4" fill="#00c48c"/>
  <circle cx="1091" cy="464" r="4" fill="#00c48c"/>

  <!-- data streams (rising beams) -->
  <g opacity="0.8">
    <rect x="300" y="300" width="3" height="180" fill="url(#beam)"/>
    <rect x="500" y="260" width="3" height="220" fill="url(#beam)" opacity="0.7"/>
    <rect x="900" y="330" width="3" height="200" fill="url(#beam)" opacity="0.6"/>
    <rect x="1240" y="290" width="3" height="240" fill="url(#beam)" opacity="0.75"/>
  </g>

  <!-- circuit lines on ground -->
  <g stroke="#00c48c" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M0 760 H520 l40 -30 h180 l30 30 h830"/>
    <path d="M0 800 H430 l50 -40 h240 l40 40 h840" stroke-opacity="0.15"/>
    <path d="M200 860 h420 l36 -28 h260 l30 28 h654" stroke-opacity="0.1"/>
  </g>
  <g fill="#00c48c">
    <circle cx="520" cy="760" r="4"/><circle cx="740" cy="730" r="4" opacity="0.7"/><circle cx="430" cy="800" r="3.5" opacity="0.5"/>
  </g>

  <!-- perspective grid floor -->
  <g stroke="#1f4470" stroke-opacity="0.5" stroke-width="1">
    <line x1="0" y1="900" x2="560" y2="700"/><line x1="260" y1="900" x2="700" y2="700"/>
    <line x1="560" y1="900" x2="860" y2="700"/><line x1="900" y1="900" x2="1030" y2="700"/>
    <line x1="1300" y1="900" x2="1160" y2="700"/><line x1="1600" y1="900" x2="1300" y2="700"/>
    <line x1="0" y1="740" x2="1600" y2="740"/><line x1="0" y1="800" x2="1600" y2="800"/><line x1="0" y1="860" x2="1600" y2="860"/>
  </g>
  <rect x="0" y="700" width="1600" height="200" fill="#0a1626" opacity="0.35"/>

  <!-- solar arrays in front -->
  <g>
    <g transform="translate(60,700)">
      <path d="M0 60 L90 10 L210 10 L120 60 Z" fill="url(#panel)" stroke="#00c48c" stroke-opacity="0.6" stroke-width="1.5"/>
      <path d="M45 35 L165 35 M90 10 L90 60 M135 10 L135 60" stroke="#00c48c" stroke-opacity="0.4" fill="none"/>
      <line x1="105" y1="60" x2="105" y2="84" stroke="#0f2340" stroke-width="6"/>
    </g>
    <g transform="translate(1240,690)">
      <path d="M0 64 L96 8 L230 8 L134 64 Z" fill="url(#panel)" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5"/>
      <path d="M48 36 L182 36 M96 8 L96 64 M144 8 L144 64" stroke="#3b82f6" stroke-opacity="0.4" fill="none"/>
      <line x1="115" y1="64" x2="115" y2="92" stroke="#0f2340" stroke-width="6"/>
    </g>
  </g>

  <!-- top vignette for text readability -->
  <rect width="1600" height="900" fill="#0a111c" opacity="0.18"/>
</svg>
