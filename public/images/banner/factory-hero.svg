<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081020"/>
      <stop offset="0.5" stop-color="#0c1c33"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffc8" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#00c48c" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#00c48c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00c48c" stop-opacity="0"/>
    </radialGradient>
    <!-- 光伏面板：深蓝玻璃面 -->
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6ea8"/>
      <stop offset="0.5" stop-color="#1a4a7d"/>
      <stop offset="1" stop-color="#123157"/>
    </linearGradient>
    <linearGradient id="cellFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ecf"/>
      <stop offset="0.55" stop-color="#22598f"/>
      <stop offset="1" stop-color="#153c68"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1e35"/>
      <stop offset="1" stop-color="#060f1c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c48c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00c48c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 星空 -->
  <g fill="#9fd8ff" opacity="0.55">
    <circle cx="110" cy="80" r="1.6"/><circle cx="300" cy="140" r="1.2"/><circle cx="520" cy="70" r="1.4"/>
    <circle cx="700" cy="150" r="1.1"/><circle cx="900" cy="60" r="1.5"/><circle cx="1330" cy="90" r="1.3"/>
    <circle cx="1520" cy="170" r="1.6"/><circle cx="200" cy="230" r="1"/><circle cx="1150" cy="200" r="1.1"/>
    <circle cx="80" cy="300" r="1.2"/><circle cx="600" cy="260" r="1"/><circle cx="1460" cy="40" r="1.2"/>
  </g>

  <!-- 太阳：低垂于地平线，能源光晕 -->
  <circle cx="1180" cy="470" r="340" fill="url(#sun)"/>
  <circle cx="1180" cy="470" r="70" fill="#00e8a6" opacity="0.85"/>
  <circle cx="1180" cy="470" r="70" fill="none" stroke="#a7ffe0" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1180" cy="470" r="120" fill="none" stroke="#00c48c" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="1180" cy="470" r="180" fill="none" stroke="#00c48c" stroke-opacity="0.18" stroke-width="1.5"/>
  <g stroke="#00e8a6" stroke-opacity="0.4" stroke-width="2">
    <line x1="1180" y1="380" x2="1180" y2="330"/>
    <line x1="1085" y1="415" x2="1050" y2="385"/>
    <line x1="1275" y1="415" x2="1310" y2="385"/>
    <line x1="1050" y1="470" x2="1000" y2="470"/>
    <line x1="1310" y1="470" x2="1360" y2="470"/>
  </g>

  <!-- 远景地平线与输电塔剪影 -->
  <rect x="0" y="620" width="1600" height="10" fill="#0a1d33" opacity="0.8"/>
  <g stroke="#0d2440" stroke-width="4" fill="none" opacity="0.9">
    <path d="M120 620 L150 500 L180 620 M128 590 h44 M136 560 h28"/>
    <path d="M420 620 L445 530 L470 620 M428 595 h34"/>
  </g>

  <!-- 远景小型光伏板 -->
  <g transform="translate(60,560)">
    <path d="M0 30 L60 6 L200 6 L140 30 Z" fill="url(#cell)" stroke="#00c48c" stroke-opacity="0.35"/>
    <line x1="70" y1="30" x2="70" y2="52" stroke="url(#leg)" stroke-width="5"/>
  </g>
  <g transform="translate(320,575)">
    <path d="M0 26 L52 4 L175 4 L122 26 Z" fill="url(#cell)" stroke="#00c48c" stroke-opacity="0.3"/>
    <line x1="62" y1="26" x2="62" y2="46" stroke="url(#leg)" stroke-width="4"/>
  </g>
  <g transform="translate(1330,565)">
    <path d="M0 30 L58 6 L195 6 L138 30 Z" fill="url(#cell)" stroke="#3b82f6" stroke-opacity="0.35"/>
    <line x1="68" y1="30" x2="68" y2="52" stroke="url(#leg)" stroke-width="5"/>
  </g>

  <!-- 中景光伏阵列（左：3 块斜向延伸） -->
  <g transform="translate(40,660)">
    <path d="M0 110 L110 20 L260 20 L150 110 Z" fill="url(#cell)" stroke="#4cd8ab" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M55 65 L205 65 M110 20 L110 110 M165 20 L165 110 M55 65 L45 110 M205 65 L215 110" stroke="#7fd8ff" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
    <line x1="75" y1="110" x2="75" y2="150" stroke="url(#leg)" stroke-width="7"/>
    <line x1="185" y1="110" x2="185" y2="150" stroke="url(#leg)" stroke-width="7"/>
    <g transform="translate(240,-14)">
      <path d="M0 124 L110 20 L260 20 L150 124 Z" fill="url(#cell)" stroke="#4cd8ab" stroke-opacity="0.65" stroke-width="2"/>
      <path d="M55 72 L205 72 M110 20 L110 124 M165 20 L165 124 M55 72 L45 124 M205 72 L215 124" stroke="#7fd8ff" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
      <line x1="75" y1="124" x2="75" y2="164" stroke="url(#leg)" stroke-width="7"/>
      <line x1="185" y1="124" x2="185" y2="164" stroke="url(#leg)" stroke-width="7"/>
    </g>
    <g transform="translate(480,-28)">
      <path d="M0 138 L110 20 L260 20 L150 138 Z" fill="url(#cell)" stroke="#4cd8ab" stroke-opacity="0.65" stroke-width="2"/>
      <path d="M55 79 L205 79 M110 20 L110 138 M165 20 L165 138 M55 79 L45 138 M205 79 L215 138" stroke="#7fd8ff" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
      <line x1="75" y1="138" x2="75" y2="178" stroke="url(#leg)" stroke-width="7"/>
      <line x1="185" y1="138" x2="185" y2="178" stroke="url(#leg)" stroke-width="7"/>
    </g>
  </g>

  <!-- 中景光伏阵列（右：3 块，朝向太阳） -->
  <g transform="translate(850,640)">
    <path d="M20 130 L140 20 L300 20 L180 130 Z" fill="url(#cell)" stroke="#4cd8ab" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M80 75 L240 75 M140 20 L140 130 M200 20 L200 130 M80 75 L68 130 M240 75 L252 130" stroke="#7fd8ff" stroke-opacity="0.38" stroke-width="1.2" fill="none"/>
    <line x1="100" y1="130" x2="100" y2="172" stroke="url(#leg)" stroke-width="7"/>
    <line x1="220" y1="130" x2="220" y2="172" stroke="url(#leg)" stroke-width="7"/>
    <g transform="translate(300,-18)">
      <path d="M20 148 L140 20 L300 20 L180 148 Z" fill="url(#cellFront)" stroke="#4cd8ab" stroke-opacity="0.7" stroke-width="2"/>
      <path d="M80 84 L240 84 M140 20 L140 148 M200 20 L200 148 M80 84 L68 148 M240 84 L252 148" stroke="#7fd8ff" stroke-opacity="0.42" stroke-width="1.2" fill="none"/>
      <line x1="100" y1="148" x2="100" y2="192" stroke="url(#leg)" stroke-width="7"/>
      <line x1="220" y1="148" x2="220" y2="192" stroke="url(#leg)" stroke-width="7"/>
    </g>
    <g transform="translate(600,-36)">
      <path d="M20 166 L140 20 L300 20 L180 166 Z" fill="url(#cellFront)" stroke="#4cd8ab" stroke-opacity="0.7" stroke-width="2"/>
      <path d="M80 93 L240 93 M140 20 L140 166 M200 20 L200 166 M80 93 L68 166 M240 93 L252 166" stroke="#7fd8ff" stroke-opacity="0.42" stroke-width="1.2" fill="none"/>
      <line x1="100" y1="166" x2="100" y2="212" stroke="url(#leg)" stroke-width="7"/>
      <line x1="220" y1="166" x2="220" y2="212" stroke="url(#leg)" stroke-width="7"/>
    </g>
  </g>

  <!-- 能量流：上升光束与光点 -->
  <g opacity="0.85">
    <rect x="330" y="420" width="3" height="230" fill="url(#beam)"/>
    <rect x="700" y="390" width="3" height="250" fill="url(#beam)" opacity="0.7"/>
    <rect x="1050" y="360" width="3" height="240" fill="url(#beam)" opacity="0.8"/>
    <rect x="1440" y="400" width="3" height="250" fill="url(#beam)" opacity="0.65"/>
  </g>
  <g fill="#00e8a6">
    <circle cx="331" cy="415" r="4"/><circle cx="701" cy="385" r="3.5" opacity="0.7"/>
    <circle cx="1051" cy="355" r="4" opacity="0.8"/><circle cx="1441" cy="395" r="3.5" opacity="0.6"/>
  </g>

  <!-- 地面网格 -->
  <g stroke="#1f4470" stroke-opacity="0.45" stroke-width="1">
    <line x1="0" y1="900" x2="520" y2="700"/><line x1="240" y1="900" x2="660" y2="700"/>
    <line x1="540" y1="900" x2="820" y2="700"/><line x1="880" y1="900" x2="990" y2="700"/>
    <line x1="1260" y1="900" x2="1130" y2="700"/><line x1="1600" y1="900" x2="1290" y2="700"/>
    <line x1="0" y1="730" x2="1600" y2="730"/><line x1="0" y1="790" x2="1600" y2="790"/><line x1="0" y1="850" x2="1600" y2="850"/>
  </g>

  <!-- 顶部压暗，保证标题可读 -->
  <rect width="1600" height="460" fill="#081020" opacity="0.35"/>
  <rect width="1600" height="900" fill="#081020" opacity="0.12"/>
</svg>
